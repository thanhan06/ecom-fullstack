services:
  db:
    image: postgres:16
    container_name: ecom_postgres
    environment:
      POSTGRES_DB: ecom
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom123
    ports:
      - "5432:5432"
    volumes:
      - ecom_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecom_redis
    ports:
      - "6379:6379"
    volumes:
      - ecom_redis_data:/data

volumes:
  ecom_pgdata:
  ecom_redis_data: